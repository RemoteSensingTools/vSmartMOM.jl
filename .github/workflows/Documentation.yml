name: Documentation
on:
  push:
    branches:
      - main
      - develop
      - sanghavi-unified
      - 'integration/**'
    tags: '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.develop(path="./")
            Pkg.instantiate()
          '
          npm ci --prefix docs
      - name: Execute documentation contracts
        working-directory: test
        run: julia --project=../docs ../docs/test_examples.jl
      - name: Execute all ten Literate tutorials
        working-directory: test
        env:
          JULIA_NUM_THREADS: 4
          OPENBLAS_NUM_THREADS: 1
        run: julia --project=../docs ../tools/check_tutorials.jl
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl

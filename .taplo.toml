# Lint/format maintained TOML, including Julia package metadata. Associate the
# RT schema only with scene locations via the rule below. Archived numerical
# evidence and generated dependency manifests are not formatter inputs.
include = [
  "*.toml",
  ".taplo.toml",
  "config/**/*.toml",
  "configs/**/*.toml",
  "examples/**/*.toml",
  "sandbox/**/*.toml",
  "test/**/*.toml",
  "docs/Project.toml",
]
exclude = ["**/Manifest.toml", "docs/build/**"]

[schema]
enabled = false

[formatting]
align_comments = true
align_entries = false
array_auto_expand = true
column_width = 100
indent_string = "  "
reorder_keys = false

[[rule]]
include = [
  "config/**/*.toml",
  "configs/**/*.toml",
  "examples/**/*.toml",
  "sandbox/**/*.toml",
  "test/test_parameters/**/*.toml",
  "test/benchmarks/*.toml",
  "test/vlidort_baseline/configs/**/*.toml",
]
exclude = [
  "**/Manifest.toml",
  "**/Project.toml",
  "**/JuliaProject.toml",
  "**/Artifacts.toml",
  "docs/build/**",
  "test/benchmarks/harness/**/*.toml",
]

[rule.schema]
enabled = true
path = "./schemas/vsmartmom-parameters.schema.json"

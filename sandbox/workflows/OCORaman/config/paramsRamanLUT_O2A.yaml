    - LambertianSurfaceScalar{Float32}(0.0)
    - LambertianSurfaceScalar{Float32}(0.0)
  polarization_type:  Stokes_IQU()
  nstreams:           3
  truncation:         auto
  depol:              -1
  float_type:         Float32
  architecture:       Architectures.GPU()

geometry:

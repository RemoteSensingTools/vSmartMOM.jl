# =================================================================
# paramsRamanLUT_O2A.yaml
#
# Dedicated input template for workflows/OCORaman/scripts/createRamanLUT_O2A.jl.
#
# Atmospheric profile provenance for manuscript notes:
#   The p/T/q values below were copied from
#   test/test_parameters/ParamsEMIT_MODTRANcomp_newLUT.yaml.  They trace to
#   AFGL 1986 Midlatitude Winter, model/table 1c, carried through the
#   EMIT/MODTRAN comparison workflow on a 20 hPa grid from 20.01 to
#   1080.01 hPa.  T and specific humidity q are layer-mid values; H2O VMR is
#   derived internally from q by the vSmartMOM parser.
#
# Absorption:
#   O2 uses the ABSCO v5.2 table.  H2O uses the rebuilt HITRAN H2O LUT and is
#   activated by the q profile below.
#
# SIF is intentionally off for the first Raman LuT generation pass.  The
# script will pass a zero SurfaceSIF source term unless SIF_STATES is
# explicitly overridden.
# =================================================================
radiative_transfer:
  spec_bands:
    # 785--762.5 nm with 250 cm^-1 Raman shoulders.
    - 12488.853503184713:0.1:13364.754098360656
    # 762.5--740 nm with 250 cm^-1 Raman shoulders.
    - 12864.754098360656:0.1:13763.513513513513

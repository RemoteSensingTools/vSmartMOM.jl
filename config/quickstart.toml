# Same portable Rayleigh scene as quickstart.yaml, with explicit numerics.
[radiative_transfer]
spec_bands = ["[12987.0]"]
surface = ["LambertianSurfaceScalar(0.15)"]
nstreams = 3
polarization_type = "Stokes_I()"
truncation = "NoTruncation()"
depol = -1
float_type = "Float64"
architecture = "CPU()"

[radiative_transfer.numerics]
fourier_convergence = "all"
ss_correction = "none"
blas_threads = 1

[geometry]
sza = 60.0
vza = [60.0]
vaz = [180.0]
obs_alt = [0]

[atmospheric_profile]
T = [250.0, 275.0]
p = [100.0, 500.0, 1000.0]
profile_reduction = -1

# Synthetic directional-scattering regression settings; not vegetation fits.
[geometry]
streams = 8
leaf_nodes = 16
azimuth_nodes = 8
solar_zenith_degrees = 40.0
leaf_beta_alpha = 2.0
leaf_beta_beta = 2.0
lai = [0.0, 0.01, 3.0, 20.0]
fourier_orders = [0, 1, 2]
stokes_components = [1, 3, 4]
spectral_counts = [1, 3]

[optics]
leaf_reflectance = 0.4
leaf_transmittance = 0.1
specular_refractive_index = 1.5
specular_extinction_index = 0.2
single_scattering_albedos = [0.15, 0.9, 1.0]
solar_stokes = [1.0, 0.1, 0.05, -0.02]
solar_spectral_scale = [1.0, 2.0, 0.5]
soil_albedo = 0.15

[numerics]
thin_threshold = 0.00001
fine_floor = 0.00000001
algebra_floor = 0.00001
blas_threads = 1

[validation]
float32_rtol = 0.0002
float32_atol = 0.000002
float64_rtol = 0.00000002
float64_atol = 0.0000000002
